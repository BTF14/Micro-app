name: AutoSkills preview (no install)

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/autoskills-preview.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/*/package.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autoskills-preview-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Verify patched Node.js runtime
        run: node -e "const [major, minor, patch] = process.versions.node.split('.').map(Number); if (major !== 22 || minor < 23 || (minor === 23 && patch < 4)) { console.error('Node.js 22.23.4 or newer in the 22.x line is required'); process.exit(1); } console.log('Verified Node.js', process.versions.node);"
      - name: Preview curated skills without installing into the repository
        run: npx --yes autoskills@0.4.1 --dry-run --verbose
