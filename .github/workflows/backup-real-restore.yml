name: Verify and restore latest encrypted backup
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  verify-and-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BACKUP_REPO: BTF14/micro-app-backups
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: microapp
      PGPASSWORD: microapp-restore-test-only
      PGDATABASE: microapp_restore
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: microapp_restore
          POSTGRES_USER: microapp
          POSTGRES_PASSWORD: microapp-restore-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U microapp -d microapp_restore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require protected credentials
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
          AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "${BACKUP_REPO_TOKEN:-}" || { echo "::error::Missing BACKUP_REPO_TOKEN"; exit 1; }
          test -n "${AGE_PRIVATE_KEY:-}" || { echo "::error::Missing AGE_PRIVATE_KEY. Add the existing age identity as a repository Actions secret; never paste it into chat."; exit 1; }
      - name: Install age and PostgreSQL 18 client
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age curl ca-certificates gnupg
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
      - name: Download and verify exact remote bytes
        id: backup
        env:
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          git -c 'credential.helper=!f() { echo username=x-access-token; echo password=$BACKUP_REPO_TOKEN; }; f' clone --depth 1 "https://github.com/$BACKUP_REPO.git" "$RUNNER_TEMP/backups-repo"
          mapfile -t files < <(find "$RUNNER_TEMP/backups-repo/daily" -maxdepth 1 -type f -name 'backup-*.dump.age' -printf '%f\n' | sort)
          (("${#files[@]}" > 0)) || { echo "::error::No encrypted backup found"; exit 1; }
          filename="${files[${#files[@]}-1]}"
          if [[ ! "$filename" =~ ^backup-[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z\.dump\.age$ ]]; then
            echo "::error::Backup artifact filename does not match the canonical UTC timestamp format."
            exit 1
          fi
          cd "$RUNNER_TEMP/backups-repo/daily"
          test -s "$filename"
          sidecar="$filename.sha256"
          test -s "$sidecar"
          mapfile -t sidecar_lines < "$sidecar"
          if (( ${#sidecar_lines[@]} != 1 )); then
            echo "::error::Backup checksum sidecar must contain exactly one line."
            exit 1
          fi
          read -r expected_digest expected_filename <<< "${sidecar_lines[0]}"
          if [[ ! "$expected_digest" =~ ^[a-f0-9]{64}$ || "$expected_filename" != "$filename" ]]; then
            echo "::error::Backup checksum sidecar does not match the canonical artifact filename."
            exit 1
          fi
          actual_digest="$(sha256sum -- "$filename" | awk '{print $1}')"
          if [[ "$actual_digest" != "$expected_digest" ]]; then
            echo "::error::Backup artifact SHA-256 verification failed."
            exit 1
          fi
          printf 'filename=%s\n' "$filename" >> "$GITHUB_OUTPUT"
      - name: Decrypt and restore with application roles into ephemeral PostgreSQL
        env:
          AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
          AGE_PUBLIC_KEY: age1t04pgcguy87u99r4stlm0gcjsk9dj2s34jsmymw55vlarfteuakse8jmfk
          BACKUP_FILENAME: ${{ steps.backup.outputs.filename }}
          RESTORE_ADMIN_URL: postgresql://microapp:microapp-restore-test-only@127.0.0.1:5432/microapp_restore
          RESTORE_MIGRATOR_URL: postgresql://microapp_migrator:migrator-restore-test-only@127.0.0.1:5432/microapp_restore
          RESTORE_RUNTIME_URL: postgresql://microapp_runtime:runtime-restore-test-only@127.0.0.1:5432/microapp_restore
          RESTORE_PRODUCER_URL: postgresql://microapp_bcv_sync:bcv-sync-restore-test-only@127.0.0.1:5432/microapp_restore
          RESTORE_DATABASE_NAME: microapp_restore
          MIGRATIONS_DIR: ${{ github.workspace }}/apps/api/migrations
        run: |
          set -euo pipefail
          umask 077
          identity="$RUNNER_TEMP/age-identity.txt"
          plaintext="$RUNNER_TEMP/backup.dump"
          printf '%s\n' "$AGE_PRIVATE_KEY" > "$identity"
          trap 'rm -f "$identity" "$plaintext" "$RUNNER_TEMP/archive.list" "$RUNNER_TEMP/age-public-key.txt"' EXIT
          age-keygen -y "$identity" > "$RUNNER_TEMP/age-public-key.txt"
          if [[ "$(cat "$RUNNER_TEMP/age-public-key.txt")" != "$AGE_PUBLIC_KEY" ]]; then
            echo "::error::AGE_PRIVATE_KEY does not match the repository backup public key."
            exit 1
          fi
          age --decrypt --identity "$identity" --output "$plaintext" "$RUNNER_TEMP/backups-repo/daily/$BACKUP_FILENAME"
          test -s "$plaintext"
          /usr/lib/postgresql/18/bin/pg_restore --list "$plaintext" > "$RUNNER_TEMP/archive.list"
          test -s "$RUNNER_TEMP/archive.list"
          bash scripts/db/restore_remote_backup_ephemeral.sh
      - name: Publish remote restore evidence without business data
        env:
          REMOTE_BACKUP_FILENAME: ${{ steps.backup.outputs.filename }}
        run: |
          set -euo pipefail
          echo "Remote object: ${REMOTE_BACKUP_FILENAME}" >> "$GITHUB_STEP_SUMMARY"
          echo "Checksum verified; encrypted remote archive decrypted and restored as microapp_migrator in disposable PostgreSQL 18. The migration-ledger profile, application roles, ownership, empty ephemeral-auth tables and independent runtime/producer logins were validated. No business rows printed." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove decrypted files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/age-identity.txt" "$RUNNER_TEMP/backup.dump" "$RUNNER_TEMP/archive.list"
          rm -rf "$RUNNER_TEMP/backups-repo"
