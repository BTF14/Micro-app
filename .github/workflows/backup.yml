name: Respaldo cifrado de la base de datos

# Nivel 1, punto 2 de docs/SECURITY_ROADMAP.md. Diseño completo y motivos en
# ese documento y en docs/BACKUP_AND_RECOVERY.md — leer ambos antes de tocar
# este workflow.
#
# Qué hace, en orden:
# 1. Vuelca (pg_dump) solo las tablas de negocio de Neon, usando un rol de
#    solo lectura dedicado (backup_readonly). Excluye explícitamente
#    auth_sessions, auth_rate_limits y auth_bootstrap_attempts (datos
#    efímeros de autenticación, no hacen falta para reconstruir el negocio).
# 2. Cifra el volcado con la llave pública age del proyecto (no es secreta,
#    por eso vive directo en este archivo) antes de que salga del runner.
#    El volcado SIN cifrar nunca se sube a ningún lado ni queda en el runner
#    más tiempo del necesario para cifrarlo.
# 3. Sube el archivo ya cifrado a BTF14/micro-app-backups (repositorio
#    privado dedicado solo a esto, nunca al repo de código).
# 4. Aplica retención: borra del repositorio de respaldos lo que tenga más
#    de 15 días.
#
# Sin la llave privada age (que el propietario guarda fuera de este
# repositorio) nadie, ni este workflow, puede leer el contenido de un
# respaldo — ver docs/SECURITY_ROADMAP.md para el procedimiento de
# restauración.

on:
  schedule:
    # 07:00 UTC = 03:00 hora de Venezuela (UTC-4), todos los días.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      AGE_PUBLIC_KEY: age1t04pgcguy87u99r4stlm0gcjsk9dj2s34jsmymw55vlarfteuakse8jmfk
      BACKUP_REPO: BTF14/micro-app-backups
      RETENTION_DAYS: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Instalar pg_dump (versión reciente) y age
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg age
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18

      - name: Verificar que la llave de la base de datos está configurada
        run: |
          if [ -z "${DATABASE_URL_BACKUP_RO:-}" ]; then
            echo "::error::Falta el secreto DATABASE_URL_BACKUP_RO en este repositorio. Ver docs/SECURITY_ROADMAP.md punto 2."
            exit 1
          fi
        env:
          DATABASE_URL_BACKUP_RO: ${{ secrets.DATABASE_URL_BACKUP_RO }}

      - name: Diagnóstico no sensible de identidad y privilegios efectivos del backup
        continue-on-error: true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP_RO }}
        shell: bash
        run: |
          set -euo pipefail
          if ! diagnostic="$(psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -Atq -F '|' <<'SQL'
          SELECT
            (current_user = 'backup_readonly' AND session_user = 'backup_readonly'),
            EXISTS (
              SELECT 1 FROM pg_catalog.pg_roles r
              WHERE r.rolname = current_user AND r.rolcanlogin
                AND NOT r.rolsuper AND NOT r.rolcreatedb AND NOT r.rolcreaterole
                AND NOT r.rolreplication AND NOT r.rolbypassrls
            ),
            EXISTS (
              SELECT 1 FROM pg_catalog.pg_auth_members m
              JOIN pg_catalog.pg_roles member_role ON member_role.oid = m.member
              WHERE member_role.rolname = current_user
            ),
            EXISTS (
              SELECT 1 FROM pg_catalog.pg_class c
              JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
              CROSS JOIN (VALUES ('INSERT'),('UPDATE'),('DELETE'),('TRUNCATE')) p(privilege)
              WHERE n.nspname = 'public' AND c.relkind IN ('r','p')
                AND pg_catalog.has_table_privilege(current_user, c.oid, p.privilege)
            ) OR EXISTS (
              SELECT 1 FROM pg_catalog.pg_class c
              JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
              CROSS JOIN (VALUES ('INSERT'),('UPDATE'),('REFERENCES')) p(privilege)
              WHERE n.nspname = 'public' AND c.relkind IN ('r','p')
                AND pg_catalog.has_any_column_privilege(current_user, c.oid, p.privilege)
            ),
            EXISTS (
              SELECT 1 FROM pg_catalog.pg_class c
              JOIN pg_catalog.pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public' AND c.relkind = 'S'
                AND (pg_catalog.has_sequence_privilege(current_user, c.oid, 'USAGE')
                  OR pg_catalog.has_sequence_privilege(current_user, c.oid, 'UPDATE'))
            ),
            pg_catalog.has_schema_privilege(current_user, 'public', 'CREATE')
            OR pg_catalog.has_database_privilege(current_user, current_database(), 'CREATE');
          SQL
          )"; then
            echo "::warning::No se pudo verificar el principal efectivo del backup; el backup continuará, pero el gate P0 sigue abierto."
            exit 0
          fi
          IFS='|' read -r identity_ok role_safe has_membership table_writes sequence_writes create_privilege <<< "$diagnostic"
          {
            echo "### Diagnóstico no sensible del principal de backup"
            echo
            echo "- Identidad efectiva esperada (`backup_readonly`): `$identity_ok`"
            echo "- Atributos de rol no privilegiados: `$role_safe`"
            echo "- Membresías de roles: `$has_membership` (esperado: `f`)"
            echo "- Privilegios de escritura sobre tablas: `$table_writes` (esperado: `f`)"
            echo "- Privilegios de mutación de secuencias: `$sequence_writes` (esperado: `f`)"
            echo "- CREATE en schema/database: `$create_privilege` (esperado: `f`)"
            echo
            echo "Este diagnóstico no imprime DSN, usuario real, credenciales ni datos. No bloquea la generación de la copia; cualquier resultado distinto al esperado mantiene abierto el gate P0."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "$identity_ok" != "t" || "$role_safe" != "t" || "$has_membership" != "f" || "$table_writes" != "f" || "$sequence_writes" != "f" || "$create_privilege" != "f" ]]; then
            echo "::warning::El contrato least-privilege del principal de backup no está demostrado; revisar issue #53 sin cambiar roles desde este workflow."
          fi

      - name: Generar el volcado
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_BACKUP_RO }}
        run: |
          set -euo pipefail
          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          PG_DUMP="/usr/lib/postgresql/18/bin/pg_dump"
          "$PG_DUMP" --version
          "$PG_DUMP" --version | grep -Eq "pg_dump \(PostgreSQL\) 18\."
          "$PG_DUMP" "$DATABASE_URL" \
            --no-owner --no-privileges --format=custom \
            --exclude-table-data=auth_sessions \
            --exclude-table-data=auth_rate_limits \
            --exclude-table-data=auth_bootstrap_attempts \
            --file="backup-${STAMP}.dump"
          test -s "backup-${STAMP}.dump"

      - name: Cifrar el volcado y borrar el original sin cifrar
        run: |
          set -euo pipefail
          age -r "$AGE_PUBLIC_KEY" -o "backup-${STAMP}.dump.age" "backup-${STAMP}.dump"
          sha256sum "backup-${STAMP}.dump.age" > "backup-${STAMP}.dump.age.sha256"
          shred -u "backup-${STAMP}.dump" 2>/dev/null || rm -f "backup-${STAMP}.dump"
          test -s "backup-${STAMP}.dump.age"

      - name: Subir el respaldo cifrado y aplicar retención
        env:
          GH_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::Falta el secreto BACKUP_REPO_TOKEN en este repositorio. Ver docs/SECURITY_ROADMAP.md punto 2."
            exit 1
          fi
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${BACKUP_REPO}.git" backups-repo
          mkdir -p backups-repo/daily
          mv "backup-${STAMP}.dump.age" "backup-${STAMP}.dump.age.sha256" backups-repo/daily/
          cd backups-repo
          git config user.email "backups-bot@micro-app.invalid"
          git config user.name "Micro app backups bot"
          git add daily/
          git commit -m "backup: ${STAMP}"
          python3 "$GITHUB_WORKSPACE/scripts/prune_backups.py" daily --retention-days "$RETENTION_DAYS"
          git add -A
          git diff --cached --quiet || git commit -m "retention: prune backups older than ${RETENTION_DAYS} days"
          git push origin HEAD:main

      - name: Publicar resumen visible si falla el respaldo
        if: failure()
        shell: bash
        run: |
          {
            echo "## ⚠️ Falló el respaldo cifrado de Micro app"
            echo
            echo "- Ejecución: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- No eliminar copias anteriores manualmente. Comprobar la última copia válida y su checksum antes de reintentar."
            echo "- Esta anotación es visible en el resumen de GitHub Actions; no sustituye una notificación externa."
          } >> "${GITHUB_STEP_SUMMARY}"
