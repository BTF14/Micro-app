name: Manual BCV source connectivity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bcv-source-connectivity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-bcv-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify BCV HTTPS response and production parser (no Neon, no secrets)
        run: pnpm --filter @micro-app/api exec vitest run src/bcv-connectivity.manual.test.ts
