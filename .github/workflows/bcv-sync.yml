name: BCV Node TLS sync

on:
  schedule:
    - cron: "17 11 * * MON-FRI"
  workflow_dispatch:
    inputs:
      force_sync:
        description: "Force an official BCV fetch even when today's valid rate is already confirmed"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bcv-production-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL_BCV_SYNC: ${{ secrets.DATABASE_URL_BCV_SYNC }}
      BCV_FORCE_SYNC: ${{ github.event_name == 'workflow_dispatch' && inputs.force_sync || false }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js 24.22.2
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate pinned Sectigo DV R36 certificate
        shell: bash
        run: |
          set -euo pipefail
          cert="apps/api/certs/sectigo-public-server-authentication-ca-dv-r36.crt"
          test -s "$cert"
          fingerprint="$(openssl x509 -in "$cert" -noout -fingerprint -sha256 | sed 's/.*=//; s/://g' | tr '[:lower:]' '[:upper:]')"
          test "$fingerprint" = "8C54C334B66BA4E426772AF4A3F9136C19A1AEC729FDB28C535C07A5A4EF22E0"
          subject="$(openssl x509 -in "$cert" -noout -subject -nameopt RFC2253 | sed 's/^subject=//')"
          issuer="$(openssl x509 -in "$cert" -noout -issuer -nameopt RFC2253 | sed 's/^issuer=//')"
          test "$subject" = "CN=Sectigo Public Server Authentication CA DV R36,O=Sectigo Limited,C=GB"
          test "$issuer" = "CN=Sectigo Public Server Authentication Root R46,O=Sectigo Limited,C=GB"
          basic="$(openssl x509 -in "$cert" -noout -ext basicConstraints)"
          printf '%s' "$basic" | grep -Fq "CA:TRUE"
          eku="$(openssl x509 -in "$cert" -noout -ext extendedKeyUsage)"
          printf '%s' "$eku" | grep -Fq "TLS Web Server Authentication"
          openssl x509 -in "$cert" -checkend 0 -noout
          not_before="$(openssl x509 -in "$cert" -startdate -noout | cut -d= -f2-)"
          test "$(date -u -d "$not_before" +%s)" -le "$(date -u +%s)"
          echo "Pinned Sectigo DV R36 certificate identity, CA/EKU and validity verified."
      - name: Run isolated BCV sync with strict Node TLS
        env:
          NODE_EXTRA_CA_CERTS: ${{ github.workspace }}/apps/api/certs/sectigo-public-server-authentication-ca-dv-r36.crt
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL_BCV_SYNC:-}" ]; then
            echo "::error::DATABASE_URL_BCV_SYNC is not configured."
            exit 1
          fi
          pnpm dlx tsx@4.20.6 apps/api/scripts/bcv-sync.ts
