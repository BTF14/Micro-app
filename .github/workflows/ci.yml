name: CI

on:
  push:
    branches: [main, "feat/**", "work/**", "security/**"]
  pull_request:
    branches: [main, "security/**", "feat/**"]

permissions:
  contents: read

concurrency:
  group: micro-app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://microapp:microapp-test-only@localhost:5432/microapp_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: microapp_test
          POSTGRES_USER: microapp
          POSTGRES_PASSWORD: microapp-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U microapp -d microapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Provision isolated migrator and runtime LOGIN roles
        run: |
          docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -c "CREATE ROLE microapp_migrator LOGIN PASSWORD 'migrator-test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS; CREATE ROLE microapp_runtime LOGIN PASSWORD 'runtime-test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT; REVOKE CREATE ON SCHEMA public FROM PUBLIC; GRANT USAGE, CREATE ON SCHEMA public TO microapp_migrator; GRANT USAGE ON SCHEMA public TO microapp_runtime; GRANT CONNECT ON DATABASE microapp_test TO microapp_migrator, microapp_runtime;"
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install ephemeral PostgreSQL test driver
        run: |
          npm install --prefix /tmp/micro-app-test-deps --no-save --no-package-lock pg @types/pg
          mkdir -p node_modules/@types
          ln -s /tmp/micro-app-test-deps/node_modules/pg node_modules/pg
          ln -s /tmp/micro-app-test-deps/node_modules/@types/pg node_modules/@types/pg
      - name: Apply schema to disposable PostgreSQL
        run: |
          docker exec -i -e PGPASSWORD=migrator-test-only "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -1 -v ON_ERROR_STOP=1 -U microapp_migrator -d microapp_test -f /dev/stdin < apps/api/migrations/0001_initial.sql
          docker exec -i -e PGPASSWORD=migrator-test-only "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -1 -v ON_ERROR_STOP=1 -U microapp_migrator -d microapp_test -f /dev/stdin < apps/api/migrations/0002_google_identity.sql
          docker exec -i -e PGPASSWORD=migrator-test-only "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -1 -v ON_ERROR_STOP=1 -U microapp_migrator -d microapp_test -f /dev/stdin < apps/api/migrations/0003_branch_scope.sql
          docker exec -i -e PGPASSWORD=migrator-test-only "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -1 -v ON_ERROR_STOP=1 -U microapp_migrator -d microapp_test -f /dev/stdin < apps/api/migrations/0004_register_shifts.sql
          docker exec -i -e PGPASSWORD=migrator-test-only "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U microapp_migrator -d microapp_test -f /dev/stdin < apps/api/migrations/0005_warehouse_inventory.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0005_warehouse_inventory.assertions.sql
          docker exec -i -e PGPASSWORD=migrator-test-only "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -1 -v ON_ERROR_STOP=1 -U microapp_migrator -d microapp_test -f /dev/stdin < apps/api/migrations/0006_register_shift_member_roles.sql
          docker exec -i -e PGPASSWORD=migrator-test-only "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U microapp_migrator -d microapp_test -f /dev/stdin < apps/api/migrations/0007_audit_logs_append_only.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0007_audit_logs_append_only.assertions.sql
          docker exec -i -e PGPASSWORD=migrator-test-only "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U microapp_migrator -d microapp_test -f /dev/stdin < apps/api/migrations/0008_inventory_count_ledger_validation.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0008_inventory_count_ledger_validation.assertions.sql
          docker exec -i -e PGPASSWORD=migrator-test-only "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U microapp_migrator -d microapp_test -f /dev/stdin < apps/api/migrations/0009_inventory_balance_ledger_coupling.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0009_inventory_balance_ledger_coupling.assertions.sql
          status=0
          output="$(docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0009_inventory_balance_ledger_coupling.deferred_failure.sql 2>&1)" || status=$?
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected unmatched balance change to fail at commit, but psql succeeded."
            exit 1
          fi
          printf '%s\n' "$output" | grep -F "INVENTORY_BALANCE_CHANGE_REQUIRES_MATCHING_LEDGER_MOVEMENT"
          remaining="$(docker exec "${{ job.services.postgres.id }}" psql -At -U microapp -d microapp_test -c "SELECT count(*) = 1 AND NOT EXISTS (SELECT 1 FROM public.inventory_balance_ledger_intents) FROM public.inventory_balances WHERE on_hand_quantity = 0")"
          test "$remaining" = "t"
      - name: Apply server-side OAuth bootstrap handoff schema
        run: docker exec -i -e PGPASSWORD=migrator-test-only "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U microapp_migrator -d microapp_test -f /dev/stdin < apps/api/migrations/0010_auth_bootstrap_attempts.sql
      - name: Verify server-side bootstrap handoff privacy and constraints
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0010_auth_bootstrap_attempts.assertions.sql
      - name: Apply hardened PostgreSQL runtime lock helpers
        run: docker exec -i -e PGPASSWORD=migrator-test-only "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U microapp_migrator -d microapp_test -f /dev/stdin < apps/api/migrations/0011_postgres_runtime_lock_helpers.sql
      - name: Verify hardened PostgreSQL runtime lock-helper contract
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0011_postgres_runtime_lock_helpers.assertions.sql
      - name: Apply least-privilege PostgreSQL runtime grants
        run: docker exec -i -e PGPASSWORD=migrator-test-only "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U microapp_migrator -d microapp_test -f /dev/stdin < apps/api/migrations/0012_postgres_runtime_role_grants.sql
      - name: Verify PostgreSQL runtime grants
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0012_postgres_runtime_role_grants.assertions.sql
      - name: Apply BCV official-rate precision and runtime grants
        run: docker exec -i -e PGPASSWORD=migrator-test-only "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U microapp_migrator -d microapp_test -f /dev/stdin < apps/api/migrations/0013_bcv_official_rate_precision_and_grants.sql
      - name: Verify BCV rate precision and least-privilege grants
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0013_bcv_official_rate_precision_and_grants.assertions.sql
      - name: Apply sales no-discount schema contract
        run: docker exec -i -e PGPASSWORD=migrator-test-only "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U microapp_migrator -d microapp_test -f /dev/stdin < apps/api/migrations/0014_sales_without_discounts.sql
      - name: Verify sales no-discount and exact-decimal contract
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0014_sales_without_discounts.assertions.sql
      - name: Apply atomic sales checkout schema and constraints
        run: docker exec -i -e PGPASSWORD=migrator-test-only "${{ job.services.postgres.id }}" psql -h 127.0.0.1 -v ON_ERROR_STOP=1 -U microapp_migrator -d microapp_test -f /dev/stdin < apps/api/migrations/0015_sales_checkout_atomicity.sql
      - name: Verify atomic sales checkout schema and runtime grants
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0015_sales_checkout_atomicity.assertions.sql
      - name: Build and typecheck
        run: pnpm build
      - name: Verify Cloudflare Pages preview isolation
        run: |
          CF_PAGES_BRANCH=preview pnpm --filter @micro-app/web build
          if grep -F "https://micro-app-api.btfcasheb.workers.dev" apps/web/dist/_headers; then
            echo "Preview CSP must not allow the production API."
            exit 1
          fi
          if grep -R -F "https://micro-app-api.btfcasheb.workers.dev" apps/web/dist/assets; then
            echo "Preview bundle must not contain the production API origin."
            exit 1
          fi
          CF_PAGES_BRANCH=preview pnpm --filter @micro-app/web exec vitest run src/Preview.test.tsx
      - name: Test backup retention policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Unit tests
        run: pnpm test
      - name: PostgreSQL auth integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/auth.integration.test.ts
      - name: PostgreSQL branch scope integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/branch-context.integration.test.ts
      - name: PostgreSQL register shift integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/register-shifts.integration.test.ts
      - name: PostgreSQL approved own-shift role integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/register-shift-member-roles.integration.test.ts
      - name: PostgreSQL authenticated cashier open-shift integration tests
        env:
          DATABASE_URL_RUNTIME: postgres://microapp_runtime:runtime-test-only@localhost:5432/microapp_test
        run: pnpm --filter @micro-app/api exec vitest run src/cashier-open-shift.integration.test.ts
      - name: PostgreSQL catalog endpoint integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/catalog.integration.test.ts
      - name: PostgreSQL catalog product creation integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/catalog-write.integration.test.ts
      - name: PostgreSQL catalog product update integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/catalog-update.integration.test.ts
      - name: PostgreSQL warehouse inventory count integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/inventory-counts.integration.test.ts
      - name: PostgreSQL atomic sales checkout integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/sales-checkout.integration.test.ts
      - name: Reset disposable OAuth throttling fixtures before runtime handler tests
        run: docker exec "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -c "DELETE FROM auth_rate_limits; DELETE FROM auth_bootstrap_attempts;"
      - name: Runtime-role API handler integration tests
        env:
          DATABASE_URL: postgres://microapp_runtime:runtime-test-only@localhost:5432/microapp_test
          DATABASE_URL_ADMIN: postgres://microapp:microapp-test-only@localhost:5432/microapp_test
        run: pnpm --filter @micro-app/api exec vitest run src/auth.integration.test.ts src/catalog.integration.test.ts src/catalog-write.integration.test.ts src/catalog-update.integration.test.ts src/inventory-counts.integration.test.ts

