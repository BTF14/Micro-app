name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "fix/**"]

permissions:
  contents: read

concurrency:
  group: micro-app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgres://microapp:microapp-test-only@localhost:5432/microapp_test
      DATABASE_URL_ADMIN: postgres://microapp:microapp-test-only@localhost:5432/microapp_test
      ADMIN_DATABASE_URL: postgres://microapp:microapp-test-only@localhost:5432/microapp_test
      MIGRATION_DATABASE_URL: postgres://microapp_migrator:migrator-test-only@localhost:5432/microapp_test
      RUNTIME_DATABASE_URL: postgres://microapp_runtime:runtime-test-only@localhost:5432/microapp_test
      BCV_DATABASE_URL: postgres://microapp_bcv_sync:bcv-test-only@localhost:5432/microapp_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: microapp_test
          POSTGRES_USER: microapp
          POSTGRES_PASSWORD: microapp-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U microapp -d microapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install ephemeral PostgreSQL test driver
        run: |
          npm install --prefix /tmp/micro-app-test-deps --no-save --no-package-lock pg @types/pg
          mkdir -p node_modules/@types
          ln -s /tmp/micro-app-test-deps/node_modules/pg node_modules/pg
          ln -s /tmp/micro-app-test-deps/node_modules/@types/pg node_modules/@types/pg
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql --version
      - name: Provision isolated migrator and runtime roles
        run: |
          psql -X -v ON_ERROR_STOP=1 --dbname "$ADMIN_DATABASE_URL" -c "CREATE ROLE microapp_migrator LOGIN PASSWORD 'migrator-test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS; CREATE ROLE microapp_runtime LOGIN PASSWORD 'runtime-test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT; CREATE ROLE microapp_bcv_sync LOGIN PASSWORD 'bcv-test-only' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT; REVOKE CREATE ON SCHEMA public FROM PUBLIC; GRANT USAGE, CREATE ON SCHEMA public TO microapp_migrator; GRANT USAGE ON SCHEMA public TO microapp_runtime, microapp_bcv_sync; GRANT CONNECT ON DATABASE microapp_test TO microapp_migrator, microapp_runtime, microapp_bcv_sync;"
      - name: Apply canonical schema through the fail-closed migration runner
        run: bash scripts/db/migrate.sh
      - name: Verify final PostgreSQL schema contract
        run: psql -X -v ON_ERROR_STOP=1 --dbname "$ADMIN_DATABASE_URL" -f apps/api/migrations/0016_runtime_inventory_ledger_read.assertions.sql
      - name: Verify BCV weekend effective-date migration 0017 contract
        run: psql -X -v ON_ERROR_STOP=1 --dbname "$ADMIN_DATABASE_URL" -f apps/api/migrations/0017_checkout_bcv_weekend_effective_date.assertions.sql
      - name: Verify checkout per-payment USD allocation migration 0018 contract
        run: psql -X -v ON_ERROR_STOP=1 --dbname "$ADMIN_DATABASE_URL" -f apps/api/migrations/0018_checkout_payment_allocation.assertions.sql
      - name: Verify ledger-authoritative inventory balance projection migration 0019 contract
        run: psql -X -v ON_ERROR_STOP=1 --dbname "$ADMIN_DATABASE_URL" -f apps/api/migrations/0019_inventory_ledger_balance_projection.assertions.sql
      - name: Verify strict BCV effective-date migration 0020 contract
        run: psql -X -v ON_ERROR_STOP=1 --dbname "$ADMIN_DATABASE_URL" -f apps/api/migrations/0020_bcv_effective_date_strict.assertions.sql
      - name: Verify BCV sync state migration 0021 contract
        run: psql -X -v ON_ERROR_STOP=1 --dbname "$ADMIN_DATABASE_URL" -f apps/api/migrations/0021_bcv_sync_state.assertions.sql
      - name: Verify dedicated BCV producer role migration 0022 contract
        run: psql -X -v ON_ERROR_STOP=1 --dbname "$ADMIN_DATABASE_URL" -f apps/api/migrations/0022_bcv_dedicated_producer_role.assertions.sql
      - name: Verify own register-shift runtime operations migration 0023 contract
        run: psql -X -v ON_ERROR_STOP=1 --dbname "$ADMIN_DATABASE_URL" -f apps/api/migrations/0023_register_shift_runtime_operations.assertions.sql
      - name: Build and typecheck
        run: pnpm build
      - name: Verify Cloudflare Pages preview isolation
        run: |
          CF_PAGES_BRANCH=preview pnpm --filter @micro-app/web build
          if grep -F "https://micro-app-api.btfcasheb.workers.dev" apps/web/dist/_headers; then
            echo "Preview CSP must not allow the production API."
            exit 1
          fi
          if grep -R -F "https://micro-app-api.btfcasheb.workers.dev" apps/web/dist/assets; then
            echo "Preview bundle must not contain the production API origin."
            exit 1
          fi
          CF_PAGES_BRANCH=preview pnpm --filter @micro-app/web exec vitest run src/Preview.test.tsx
      - name: Test backup retention policy
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Unit tests
        run: pnpm test
      - name: PostgreSQL auth integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/auth.integration.test.ts
      - name: PostgreSQL auth rate limit integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/auth-rate-limit.integration.test.ts
      - name: PostgreSQL BCV effective-date integration tests (dedicated producer LOGIN)
        run: DATABASE_URL="$BCV_DATABASE_URL" DATABASE_URL_RUNTIME="$RUNTIME_DATABASE_URL" DATABASE_URL_ADMIN="$ADMIN_DATABASE_URL" pnpm --filter @micro-app/api exec vitest run src/exchange-rates.integration.test.ts
      - name: PostgreSQL branch scope integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/branch-context.integration.test.ts
      - name: PostgreSQL register shift integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/register-shifts.integration.test.ts
      - name: PostgreSQL authenticated cashier open-shift integration tests
        run: DATABASE_URL_RUNTIME="$RUNTIME_DATABASE_URL" pnpm --filter @micro-app/api exec vitest run src/cashier-open-shift.integration.test.ts
      - name: PostgreSQL own register-shift API integration tests (runtime LOGIN)
        run: DATABASE_URL_RUNTIME="$RUNTIME_DATABASE_URL" DATABASE_URL_ADMIN="$ADMIN_DATABASE_URL" pnpm --filter @micro-app/api exec vitest run src/register-shifts-api.integration.test.ts
      - name: PostgreSQL register-shift member role integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/register-shift-member-roles.integration.test.ts
      - name: PostgreSQL catalog integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/catalog.integration.test.ts
      - name: PostgreSQL catalog create integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/catalog-write.integration.test.ts
      - name: PostgreSQL catalog update integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/catalog-update.integration.test.ts
      - name: PostgreSQL inventory count integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/inventory-counts.integration.test.ts
      - name: PostgreSQL inventory read integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/inventory-read.integration.test.ts
      - name: PostgreSQL atomic sales checkout integration tests
        run: DATABASE_URL="$RUNTIME_DATABASE_URL" DATABASE_URL_ADMIN="$ADMIN_DATABASE_URL" pnpm --filter @micro-app/api exec vitest run src/sales-checkout.integration.test.ts
      - name: PostgreSQL branch list integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/branches.integration.test.ts
      - name: Runtime-role API integration tests
        run: |
          DATABASE_URL="$RUNTIME_DATABASE_URL" DATABASE_URL_ADMIN="$ADMIN_DATABASE_URL" pnpm --filter @micro-app/api exec vitest run --no-file-parallelism src/auth.integration.test.ts src/auth-rate-limit.integration.test.ts src/branch-context.integration.test.ts src/catalog.integration.test.ts src/catalog-write.integration.test.ts src/catalog-update.integration.test.ts src/inventory-counts.integration.test.ts src/inventory-read.integration.test.ts src/branches.integration.test.ts
