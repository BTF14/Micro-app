name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: micro-app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgres://microapp:microapp-test-only@localhost:5432/microapp_test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: microapp_test
          POSTGRES_USER: microapp
          POSTGRES_PASSWORD: microapp-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U microapp -d microapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install ephemeral PostgreSQL test driver
        run: |
          npm install --prefix /tmp/micro-app-test-deps --no-save --no-package-lock pg @types/pg
          mkdir -p node_modules/@types
          ln -s /tmp/micro-app-test-deps/node_modules/pg node_modules/pg
          ln -s /tmp/micro-app-test-deps/node_modules/@types/pg node_modules/@types/pg
      - name: Apply schema to disposable PostgreSQL
        run: |
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0001_initial.sql
          docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0002_google_identity.sql
      - name: Build and typecheck
        run: pnpm build
      - name: Verify Cloudflare Pages preview isolation
        run: |
          CF_PAGES_BRANCH=preview pnpm --filter @micro-app/web build
          if grep -F "https://micro-app-api.btfcasheb.workers.dev" apps/web/dist/_headers; then
            echo "Preview CSP must not allow the production API."
            exit 1
          fi
          if grep -R -F "https://micro-app-api.btfcasheb.workers.dev" apps/web/dist/assets; then
            echo "Preview bundle must not contain the production API origin."
            exit 1
          fi
          CF_PAGES_BRANCH=preview pnpm --filter @micro-app/web exec vitest run src/Preview.test.tsx
      - name: Unit tests
        run: pnpm test
      - name: PostgreSQL auth integration tests
        run: pnpm --filter @micro-app/api exec vitest run src/auth.integration.test.ts
