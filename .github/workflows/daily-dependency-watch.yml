name: Daily dependency watch

on:
  schedule:
    # 08:15 UTC daily (04:15 Venezuela); report-only, no dependency changes.
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: micro-app-dependency-watch
  cancel-in-progress: true

jobs:
  dependency-watch:
    name: Stable dependency and security report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm 10
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install exactly the committed lockfile
        run: pnpm install --frozen-lockfile

      - name: Report runtime and stable package updates
        id: outdated
        shell: bash
        run: |
          set +e
          pnpm -r outdated --latest > /tmp/pnpm-outdated.txt 2>&1
          outdated_status=$?
          set -e
          echo "status=$outdated_status" >> "$GITHUB_OUTPUT"

          {
            printf '## Daily dependency watch\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Runtime used by this report: `%s`\n' "$(node --version)"
            printf -- '- Package manager used by this report: `%s`\n' "$(pnpm --version)"
            printf '%s\n\n' '- Schedule: daily at 08:15 UTC (04:15 Venezuela); manual runs are also available.'
            printf '### Latest Node.js 24 LTS patch\n'
            if curl --fail --silent --show-error --max-time 20 https://nodejs.org/dist/index.json -o /tmp/node-releases.json; then
              node -e 'const rows=require("/tmp/node-releases.json"); const v=rows.find(x=>/^v24\./.test(x.version)&&x.lts); if(v) console.log("- Latest published Node 24 LTS release: `"+v.version+"` ("+v.date+")."); else console.log("- Could not identify the latest Node 24 LTS release from the official index.");'
            else
              printf '%s\n' '- Official Node.js release index could not be reached during this run.'
            fi
            printf '\n### Package updates (pnpm -r outdated --latest)\n\n'
            if [ -s /tmp/pnpm-outdated.txt ]; then
              printf ' ```text\n'
              cat /tmp/pnpm-outdated.txt
              printf '\n```\n'
            else
              printf '%s\n' 'No output returned by pnpm outdated; inspect the command status and logs before concluding that no updates exist.'
            fi
            printf '\n'
            if [ "$outdated_status" -ne 0 ]; then
              printf '> Note: `pnpm -r outdated --latest` returned status %s. This may mean updates exist or the registry query failed; inspect the output above before concluding.\n' "$outdated_status"
            fi
            printf '\n### Interpretation rules\n'
            printf '%s\n' '- This is a report, not an automatic upgrade. It does not create PRs or modify manifests/lockfiles.'
            printf '%s\n' '- Prefer supported stable/LTS releases; do not treat prereleases or a newer major as automatically safe.'
            printf '%s\n' '- Review breaking changes, engines, peer dependencies, advisories, and the full lockfile diff before upgrading.'
            printf '%s\n' '- Preserve `pnpm.overrides.undici = 7.30.1` in both `package.json` and `pnpm-lock.yaml` unless a reviewed security change explicitly replaces it.'
            printf '%s\n' '- Dependabot separately checks npm dependencies and GitHub Actions weekly; this daily workflow adds visibility, not automatic remediation.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Audit known dependency vulnerabilities (high and critical fail the run)
        id: audit
        shell: bash
        continue-on-error: true
        run: |
          set +e
          pnpm audit --audit-level high > /tmp/pnpm-audit.txt 2>&1
          audit_status=$?
          set -e
          echo "status=$audit_status" >> "$GITHUB_OUTPUT"
          cat /tmp/pnpm-audit.txt
          exit "$audit_status"

      - name: Add audit findings to the run summary
        if: always()
        shell: bash
        run: |
          {
            printf '\n### Vulnerability audit (pnpm audit --audit-level high)\n\n'
            if [ -s /tmp/pnpm-audit.txt ]; then
              printf ' ```text\n'
              cat /tmp/pnpm-audit.txt
              printf '\n```\n'
            else
              printf '%s\n' 'Audit did not produce a report; inspect the job logs.'
            fi
            printf '\n'
            if [ "${{ steps.audit.outcome }}" = "failure" ]; then
              printf '%s\n' '**Action required:** the audit step failed. This may indicate a high/critical advisory or a registry/tool error; inspect the output before deciding.'
              exit 1
            else
              printf '%s\n' 'The audit step completed successfully; review the report above for the exact finding count.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
