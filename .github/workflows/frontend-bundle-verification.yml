name: Frontend bundle verification (public Pages)

# Read-only verification for issue #78's remaining gap: confirm that the
# JavaScript bundle actually published to Cloudflare Pages contains the
# canonical Worker API base URL (apps/web/.env.production ->
# VITE_API_BASE_URL, compiled into __MICRO_APP_API_BASE_URL__ by
# apps/web/vite.config.ts), rather than inferring it from versioned source
# alone. Runs on a GitHub Actions runner with full internet egress, unlike
# this project's AI sandboxes, which cannot reach micro-app-63i.pages.dev
# or micro-app-api.btfcasheb.workers.dev at all (confirmed repeatedly in
# issue #78's history: 403 on the outbound CONNECT tunnel).
#
# Read-only: no secrets, cookies or tokens are used, and nothing is
# deployed, configured or changed on Cloudflare.

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 09:05 UTC (05:05 Venezuela) — alongside the CORS check.
    - cron: "5 9 * * 1"
  pull_request:
    paths:
      - ".github/workflows/frontend-bundle-verification.yml"

permissions:
  contents: read

concurrency:
  group: micro-app-frontend-bundle-verification-${{ github.ref }}
  cancel-in-progress: true

env:
  FRONTEND_URL: https://micro-app-63i.pages.dev/
  EXPECTED_API_BASE_URL: https://micro-app-api.btfcasheb.workers.dev

jobs:
  bundle-verification:
    name: Confirm published bundle uses the canonical API base URL
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the published index.html
        shell: bash
        run: |
          set -e
          curl -sS -i --max-time 20 "$FRONTEND_URL" -o /tmp/index-response.txt
          status_line=$(head -n1 /tmp/index-response.txt | tr -d '\r')
          echo "Status: $status_line"
          if ! echo "$status_line" | grep -Eq 'HTTP/[0-9.]+ 2[0-9]{2}'; then
            echo "Unexpected status fetching $FRONTEND_URL: $status_line"
            cat /tmp/index-response.txt
            exit 1
          fi
          # Body only (strip response headers before the blank line).
          awk 'BEGIN{body=0} /^\r?$/{body=1; next} body{print}' /tmp/index-response.txt > /tmp/index.html
          grep -oE '"Continuar con Google"[^<]*|href="[^"]*"' /tmp/index.html | grep -i 'auth/google' || true

      - name: Extract script src URLs referenced by index.html
        id: extract
        shell: bash
        run: |
          set -e
          grep -oE '<script[^>]+src="[^"]+"' /tmp/index.html \
            | grep -oE 'src="[^"]+"' \
            | sed -E 's/^src="([^"]+)"$/\1/' > /tmp/script-srcs.txt || true
          echo "Found script sources:"
          cat /tmp/script-srcs.txt || true
          if [ ! -s /tmp/script-srcs.txt ]; then
            echo "No <script src=...> tags found in the published index.html; cannot verify the bundle."
            exit 1
          fi

      - name: Download referenced bundles and search for the canonical API base URL
        id: scan
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/bundles
          found=false
          i=0
          found_wrong_host=""
          while IFS= read -r src; do
            i=$((i + 1))
            case "$src" in
              http://*|https://*) url="$src" ;;
              /*) url="https://micro-app-63i.pages.dev${src}" ;;
              *) url="https://micro-app-63i.pages.dev/${src}" ;;
            esac
            out="/tmp/bundles/bundle-$i.js"
            echo "Fetching $url"
            if curl -sS -f --max-time 20 "$url" -o "$out"; then
              if grep -qF "$EXPECTED_API_BASE_URL" "$out"; then
                echo "  -> contains $EXPECTED_API_BASE_URL"
                found=true
              fi
              # Flag any *other* workers.dev host baked into the bundle, which
              # would indicate a stale or wrong build.
              other=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$out" | sort -u | grep -vF "$EXPECTED_API_BASE_URL" || true)
              if [ -n "$other" ]; then
                found_wrong_host="$found_wrong_host $other"
              fi
            else
              echo "  -> could not fetch (non-2xx or network error); skipping"
            fi
          done < /tmp/script-srcs.txt

          echo "api_base_found=$found" >> "$GITHUB_OUTPUT"
          echo "wrong_host=$found_wrong_host" >> "$GITHUB_OUTPUT"

      - name: Evaluate and publish evidence
        shell: bash
        run: |
          set -e

          google_link=$(grep -oE 'href="[^"]*auth/google[^"]*"' /tmp/index.html | head -n1 || true)

          {
            printf '## Frontend bundle verification — micro-app (public, read-only)\n\n'
            printf -- '- Frontend: `%s`\n' "$FRONTEND_URL"
            printf -- '- Expected API base URL (from `apps/web/.env.production`): `%s`\n' "$EXPECTED_API_BASE_URL"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Run time (UTC): `%s`\n\n' "$(date -u +%FT%TZ)"

            printf '### Google OAuth link found in the published HTML\n\n'
            if [ -n "$google_link" ]; then
              printf '```text\n%s\n```\n\n' "$google_link"
            else
              printf 'Not found in index.html (may be rendered client-side after hydration; this check only inspects the static HTML).\n\n'
            fi

            printf '### Script bundles inspected\n\n'
            printf '```text\n%s\n```\n\n' "$(cat /tmp/script-srcs.txt)"

            printf '### Result\n\n'
          } >> "$GITHUB_STEP_SUMMARY"

          pass=true
          if [ "${{ steps.scan.outputs.api_base_found }}" != "true" ]; then
            pass=false
            echo "- **FAIL.** None of the fetched bundles contain the literal string \`$EXPECTED_API_BASE_URL\`." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **PASS.** At least one published bundle contains the literal, compiled-in API base URL \`$EXPECTED_API_BASE_URL\` (from \`__MICRO_APP_API_BASE_URL__\`)." >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "${{ steps.scan.outputs.wrong_host }}" ]; then
            pass=false
            echo "- **FAIL.** Found a different \`*.workers.dev\` host baked into a published bundle, which should not be there:${{ steps.scan.outputs.wrong_host }}" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "- This run only reads public, already-published files; it does not deploy, configure or modify Cloudflare, DNS or any secret." >> "$GITHUB_STEP_SUMMARY"

          if [ "$pass" != true ]; then
            exit 1
          fi
