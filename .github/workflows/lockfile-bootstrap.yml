name: Temporary pnpm lockfile bootstrap

on:
  push:
    branches: [fix/pnpm-lockfile-bootstrap]

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Generate lockfile with pnpm
        run: pnpm install --no-frozen-lockfile
      - name: Commit generated lockfile to bootstrap branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): add pnpm lockfile"
            git push
          fi
