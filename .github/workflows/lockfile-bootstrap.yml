name: Temporary pnpm lockfile bootstrap

on:
  push:
    branches: [fix/pnpm-lockfile-bootstrap]

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Generate lockfile with pnpm
        run: pnpm install --no-frozen-lockfile
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lockfile-bootstrap
          path: pnpm-lock.yaml
          if-no-files-found: error
          retention-days: 1
