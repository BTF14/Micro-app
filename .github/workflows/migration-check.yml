name: Database migration validation

on:
  push:
    branches: [main, feat/tenant-safe-schema, "feat/**", "work/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: micro-app-migration-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: microapp_test
          POSTGRES_USER: microapp
          POSTGRES_PASSWORD: microapp-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U microapp -d microapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Apply initial schema to disposable PostgreSQL
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0001_initial.sql
      - name: Verify cross-tenant constraints reject invalid references
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0001_initial.assertions.sql
      - name: Apply Google identity schema to disposable PostgreSQL
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0002_google_identity.sql
      - name: Verify allowlist/bootstrap constraints reject invalid state
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0002_google_identity.assertions.sql
      - name: Apply branch scope schema to disposable PostgreSQL
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0003_branch_scope.sql
      - name: Verify cross-organization branch scope constraints
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0003_branch_scope.assertions.sql
      - name: Apply register and shift schema to disposable PostgreSQL
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0004_register_shifts.sql
      - name: Verify register and shift integrity/lifecycle assertions
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0004_register_shifts.assertions.sql
      - name: Verify warehouse inventory migration rolls back on failure
        run: |
          sed '/^COMMIT;$/i SELECT 1/0;' apps/api/migrations/0005_warehouse_inventory.sql > /tmp/0005-warehouse-inventory-failure.sql
          if docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < /tmp/0005-warehouse-inventory-failure.sql; then
            echo "Expected the injected migration failure, but psql succeeded."
            exit 1
          fi
          remaining="$(docker exec "${{ job.services.postgres.id }}" psql -At -U microapp -d microapp_test -c "SELECT to_regclass('public.warehouses') IS NULL AND to_regclass('public.inventory_counts') IS NULL")"
          test "$remaining" = "t"
      - name: Apply warehouse inventory schema to disposable PostgreSQL
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0005_warehouse_inventory.sql
      - name: Verify warehouse inventory constraints and lifecycle assertions
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0005_warehouse_inventory.assertions.sql
      - name: Apply approved register-shift member roles schema
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0006_register_shift_member_roles.sql
      - name: Verify audit logs migration rolls back on failure
        run: |
          sed '/^COMMIT;$/i SELECT 1/0;' apps/api/migrations/0007_audit_logs_append_only.sql > /tmp/0007-audit-logs-failure.sql
          if docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < /tmp/0007-audit-logs-failure.sql; then
            echo "Expected the injected audit migration failure, but psql succeeded."
            exit 1
          fi
          remaining="$(docker exec "${{ job.services.postgres.id }}" psql -At -U microapp -d microapp_test -c "SELECT to_regprocedure('public.reject_audit_logs_mutation()') IS NULL AND NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgrelid='public.audit_logs'::regclass AND tgname IN ('audit_logs_10_append_only_rows','audit_logs_20_append_only_truncate'))")"
          test "$remaining" = "t"
      - name: Apply audit logs append-only migration
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0007_audit_logs_append_only.sql
      - name: Verify audit logs immutability and runtime-role assertions
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0007_audit_logs_append_only.assertions.sql
      - name: Verify count-ledger validation migration rolls back on failure
        run: |
          sed '/^COMMIT;$/i SELECT 1/0;' apps/api/migrations/0008_inventory_count_ledger_validation.sql > /tmp/0008-count-ledger-failure.sql
          if docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < /tmp/0008-count-ledger-failure.sql; then
            echo "Expected the injected count-ledger migration failure, but psql succeeded."
            exit 1
          fi
          remaining="$(docker exec "${{ job.services.postgres.id }}" psql -At -U microapp -d microapp_test -c "SELECT position('INVENTORY_COUNT_PHYSICAL_SNAPSHOT_REQUIRED' in pg_get_functiondef('public.guard_inventory_count_lifecycle()'::regprocedure)) = 0 AND position('INVENTORY_MOVEMENT_DELTA_MUST_MATCH_COUNT_SNAPSHOT' in pg_get_functiondef('public.validate_count_inventory_movement()'::regprocedure)) = 0")"
          test "$remaining" = "t"
      - name: Apply count snapshot and ledger validation migration
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0008_inventory_count_ledger_validation.sql
      - name: Verify count snapshot and ledger delta assertions
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0008_inventory_count_ledger_validation.assertions.sql
      - name: Verify balance-ledger coupling migration rolls back on failure
        run: |
          sed '/^COMMIT;$/i SELECT 1/0;' apps/api/migrations/0009_inventory_balance_ledger_coupling.sql > /tmp/0009-balance-ledger-failure.sql
          if docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < /tmp/0009-balance-ledger-failure.sql; then
            echo "Expected the injected balance-ledger migration failure, but psql succeeded."
            exit 1
          fi
          remaining="$(docker exec "${{ job.services.postgres.id }}" psql -At -U microapp -d microapp_test -c "SELECT to_regclass('public.inventory_balance_ledger_intents') IS NULL AND to_regprocedure('public.record_inventory_balance_ledger_intent()') IS NULL AND NOT EXISTS (SELECT 1 FROM pg_trigger WHERE tgname IN ('inventory_balances_ledger_intent','warehouse_inventory_movements_require_balance_intent','inventory_balance_ledger_intent_complete'))")"
          test "$remaining" = "t"
      - name: Apply transactional balance-ledger coupling migration
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0009_inventory_balance_ledger_coupling.sql
      - name: Verify transactional balance-ledger coupling assertions
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0009_inventory_balance_ledger_coupling.assertions.sql
