name: Database migration validation

on:
  push:
    branches: [main, feat/tenant-safe-schema, "feat/**", "work/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: micro-app-migration-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: microapp_test
          POSTGRES_USER: microapp
          POSTGRES_PASSWORD: microapp-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U microapp -d microapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Apply initial schema to disposable PostgreSQL
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0001_initial.sql
      - name: Verify cross-tenant constraints reject invalid references
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0001_initial.assertions.sql
      - name: Apply Google identity schema to disposable PostgreSQL
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0002_google_identity.sql
      - name: Verify allowlist/bootstrap constraints reject invalid state
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0002_google_identity.assertions.sql
      - name: Apply branch scope schema to disposable PostgreSQL
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0003_branch_scope.sql
      - name: Verify cross-organization branch scope constraints
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0003_branch_scope.assertions.sql
      - name: Apply register and shift schema to disposable PostgreSQL
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0004_register_shifts.sql
      - name: Verify register and shift integrity/lifecycle assertions
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0004_register_shifts.assertions.sql
      - name: Verify warehouse inventory migration rolls back on failure
        run: |
          sed '/^COMMIT;$/i SELECT 1/0;' apps/api/migrations/0005_warehouse_inventory.sql > /tmp/0005-warehouse-inventory-failure.sql
          if docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < /tmp/0005-warehouse-inventory-failure.sql; then
            echo "Expected the injected migration failure, but psql succeeded."
            exit 1
          fi
          remaining="$(docker exec "${{ job.services.postgres.id }}" psql -At -U microapp -d microapp_test -c "SELECT to_regclass('public.warehouses') IS NULL AND to_regclass('public.inventory_counts') IS NULL")"
          test "$remaining" = "t"
      - name: Apply warehouse inventory schema to disposable PostgreSQL
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0005_warehouse_inventory.sql
      - name: Verify warehouse inventory constraints and lifecycle assertions
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0005_warehouse_inventory.assertions.sql
      - name: Apply approved register-shift member roles schema to disposable PostgreSQL
        run: docker exec -i "${{ job.services.postgres.id }}" psql -v ON_ERROR_STOP=1 -U microapp -d microapp_test -f /dev/stdin < apps/api/migrations/0006_register_shift_member_roles.sql
