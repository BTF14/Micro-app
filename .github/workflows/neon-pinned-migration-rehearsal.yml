name: Neon pinned migration rehearsal

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Read-only preflight by default; writes require explicit confirmation"
        required: true
        type: choice
        default: verify-empty
        options:
          - verify-empty
          - bootstrap-and-migrate
      confirmation:
        description: "Required only for bootstrap-and-migrate"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: neon-pinned-migration-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_BRANCH: feat/checkout-ledger-recovered-main-20261108
      SOURCE_SHA: 6227a3a8497f6be94d675b64da5da61530c200fc
      TARGET_DATABASE: microapp_rehearsal
      EXPECTED_BRANCH_ID: br-curly-poetry-b7dxsddm
      EXPECTED_PROJECT_ID: restless-fire-99110035
    steps:
      - name: Checkout trusted runner from main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Require manual dispatch from main
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          echo "DISPATCH_REF_VERIFIED"

      - name: Derive empty rehearsal database URL without exposing credentials
        shell: bash
        env:
          NEON_REHEARSAL_DATABASE_URL: ${{ secrets.NEON_REHEARSAL_DATABASE_URL }}
        run: |
          set -euo pipefail
          target_url="$(python3 - <<'PY'
          import os
          from urllib.parse import parse_qsl, urlencode, urlsplit, urlunsplit

          raw = os.environ["NEON_REHEARSAL_DATABASE_URL"]
          parts = urlsplit(raw)
          if parts.scheme not in ("postgres", "postgresql"):
              raise SystemExit("Unexpected PostgreSQL URL scheme")
          if not parts.hostname or "-pooler" in parts.hostname.lower():
              raise SystemExit("A direct Neon connection is required")
          if parts.path.rstrip("/") != "/neondb":
              raise SystemExit("The configured rehearsal secret must still target neondb")
          query = [(key, value) for key, value in parse_qsl(parts.query, keep_blank_values=True)
                   if key.lower() != "dbname"]
          print(urlunsplit((parts.scheme, parts.netloc, "/microapp_rehearsal",
                            urlencode(query), parts.fragment)))
          PY
          )"
          test -n "$target_url"
          echo "::add-mask::$target_url"
          printf 'NEON_REHEARSAL_TARGET_DATABASE_URL=%s\n' "$target_url" >> "$GITHUB_ENV"
          printf 'MIGRATION_DATABASE_URL=%s\n' "$target_url" >> "$GITHUB_ENV"
          echo "TARGET_DATABASE_URL_DERIVED"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Fetch and verify pinned migration source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/heads/$SOURCE_BRANCH"
          actual_sha="$(git rev-parse FETCH_HEAD)"
          test "$actual_sha" = "$SOURCE_SHA"

          source_root="$RUNNER_TEMP/pinned-migration-source"
          mkdir -p "$source_root"
          git archive "$SOURCE_SHA" apps/api/migrations | tar -x -C "$source_root"
          migrations_dir="$source_root/apps/api/migrations"
          test -d "$migrations_dir"
          test -f "$migrations_dir/0017_checkout_bcv_weekend_effective_date.sql"
          test -f "$migrations_dir/0018_checkout_payment_allocation.sql"
          test -f "$migrations_dir/0019_inventory_ledger_balance_projection.sql"

          mapfile -t versions < <(
            find "$migrations_dir" -maxdepth 1 -type f \
              -name '[0-9][0-9][0-9][0-9]_*.sql' \
              ! -name '*.assertions.sql' \
              ! -name '*.deferred_failure.sql' \
              -printf '%f\n' | sed -E 's/^([0-9]{4})_.*/\1/' | sort
          )
          test "${#versions[@]}" -eq 19
          for index in "${!versions[@]}"; do
            expected="$(printf '%04d' "$((index + 1))")"
            test "${versions[$index]}" = "$expected"
          done

          for version in 0017 0018 0019; do
            matches=("$migrations_dir"/"${version}"_*.assertions.sql)
            test "${#matches[@]}" -eq 1
            test -f "${matches[0]}"
          done

          baseline_dir="$RUNNER_TEMP/pinned-baseline-migrations"
          mkdir -p "$baseline_dir"
          for version in 0001 0002; do
            mapfile -t matches < <(
              find "$migrations_dir" -maxdepth 1 -type f \
                -name "${version}_*.sql" \
                ! -name '*.assertions.sql' \
                ! -name '*.deferred_failure.sql'
            )
            test "${#matches[@]}" -eq 1
            cp "${matches[0]}" "$baseline_dir/"
          done
          test -f "$migrations_dir/baselines/0002.schema.txt"
          printf 'PINNED_MIGRATIONS_DIR=%s\n' "$migrations_dir" >> "$GITHUB_ENV"
          printf 'PINNED_BASELINE_MIGRATIONS_DIR=%s\n' "$baseline_dir" >> "$GITHUB_ENV"
          echo "PINNED_MIGRATION_SOURCE_VERIFIED=$actual_sha"
          echo "MIGRATION_CHAIN_VERIFIED=0001-0019"

      # A failed migration may leave state=applying; this workflow rejects automatic retry in that case.
      # Reconcile or recreate the empty rehearsal database explicitly before another write attempt.
      - name: Verify target identity, role boundaries and safe migration state
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          TARGET_URL="$NEON_REHEARSAL_TARGET_DATABASE_URL"
          identity="$(psql -X -A -t -v ON_ERROR_STOP=1 --dbname "$TARGET_URL" -c "
            SELECT current_database() || '|' || current_user || '|' || session_user || '|' ||
                   COALESCE(current_setting('neon.branch_id', true),'') || '|' ||
                   COALESCE(current_setting('neon.project_id', true),'');
          ")"
          expected="microapp_rehearsal|microapp_migrator|microapp_migrator|$EXPECTED_BRANCH_ID|$EXPECTED_PROJECT_ID"
          test "$identity" = "$expected"

          roles="$(psql -X -A -t -v ON_ERROR_STOP=1 --dbname "$TARGET_URL" -c "
            SELECT
              (SELECT rolcanlogin AND NOT rolsuper AND NOT rolcreatedb
                      AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls
               FROM pg_catalog.pg_roles WHERE rolname='microapp_migrator')
              AND
              (SELECT rolcanlogin AND NOT rolsuper AND NOT rolcreatedb
                      AND NOT rolcreaterole AND NOT rolreplication AND NOT rolbypassrls
                      AND NOT rolinherit
               FROM pg_catalog.pg_roles WHERE rolname='microapp_runtime')
              AND pg_catalog.has_schema_privilege('microapp_migrator','public','USAGE')
              AND pg_catalog.has_schema_privilege('microapp_migrator','public','CREATE')
              AND pg_catalog.has_schema_privilege('microapp_runtime','public','USAGE')
              AND NOT pg_catalog.has_schema_privilege('microapp_runtime','public','CREATE')
              AND pg_catalog.has_database_privilege('microapp_migrator',current_database(),'CONNECT')
              AND pg_catalog.has_database_privilege('microapp_runtime',current_database(),'CONNECT')
              AND (SELECT pg_catalog.pg_get_userbyid(datdba)='microapp_migrator'
                   FROM pg_catalog.pg_database WHERE datname=current_database())
              AND NOT EXISTS (
                SELECT 1 FROM pg_catalog.pg_auth_members
                WHERE member IN (
                  SELECT oid FROM pg_catalog.pg_roles
                  WHERE rolname IN ('microapp_migrator','microapp_runtime')
                )
              )
              AND NOT pg_catalog.pg_has_role('microapp_runtime','microapp_migrator','MEMBER');
          ")"
          test "$roles" = "t"

          empty="$(psql -X -A -t -v ON_ERROR_STOP=1 --dbname "$TARGET_URL" -c "
            SELECT pg_catalog.to_regclass('public.schema_migrations') IS NULL
              AND NOT EXISTS (
                SELECT 1 FROM pg_catalog.pg_class
                WHERE relnamespace='public'::regnamespace
                  AND relkind IN ('r','p','v','m','S','f')
              )
              AND NOT EXISTS (
                SELECT 1 FROM pg_catalog.pg_proc
                WHERE pronamespace='public'::regnamespace
              )
              AND NOT EXISTS (
                SELECT 1 FROM pg_catalog.pg_namespace
                WHERE nspname NOT IN ('pg_catalog','information_schema','pg_toast','public')
              )
              AND NOT EXISTS (
                SELECT 1 FROM pg_catalog.pg_type
                WHERE typnamespace='public'::regnamespace
                  AND typrelid=0 AND typelem=0
              );
          ")"
          has_ledger="$(psql -X -A -t -v ON_ERROR_STOP=1 --dbname "$TARGET_URL" -c "
            SELECT pg_catalog.to_regclass('public.schema_migrations') IS NOT NULL;
          ")"

          if [[ "$OPERATION" == "verify-empty" ]]; then
            test "$empty" = "t"
            echo "EMPTY_REHEARSAL_TARGET_VERIFIED"
          else
            if [[ "$has_ledger" == "t" ]]; then
              ledger_prefix="$(psql -X -A -t -v ON_ERROR_STOP=1 --dbname "$TARGET_URL" -c "
                SELECT count(*) <= 19
                  AND (
                    count(*) = 0
                    OR (
                      min(version)='0001'
                      AND max(version)=pg_catalog.lpad(count(*)::text,4,'0')
                      AND count(DISTINCT version)=count(*)
                      AND pg_catalog.bool_and(state='applied')
                    )
                  )
                FROM public.schema_migrations;
              ")"
              test "$ledger_prefix" = "t"
              echo "APPLIED_MIGRATION_LEDGER_PREFIX_VERIFIED"
            else
              test "$empty" = "t"
              echo "EMPTY_TARGET_VERIFIED_FOR_BOOTSTRAP"
            fi
          fi

      # The default path is read-only; the pinned write path is manual and never deploys the Worker.
      - name: Require exact write confirmation
        if: ${{ inputs.operation == 'bootstrap-and-migrate' }}
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          expected="APPLY-ONLY-microapp_rehearsal-br-curly-poetry-b7dxsddm-6227a3a8497f6be94d675b64da5da61530c200fc"
          test "$CONFIRMATION" = "$expected"
          echo "EXPLICIT_REHEARSAL_WRITE_CONFIRMATION_VERIFIED"

      - name: Apply baseline 0001-0002 and verify canonical fingerprint
        if: ${{ inputs.operation == 'bootstrap-and-migrate' }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_URL="$NEON_REHEARSAL_TARGET_DATABASE_URL"
          has_ledger="$(psql -X -A -t -v ON_ERROR_STOP=1 --dbname "$TARGET_URL" -c "
            SELECT pg_catalog.to_regclass('public.schema_migrations') IS NOT NULL;
          ")"
          max_version="0000"
          if [[ "$has_ledger" == "t" ]]; then
            max_version="$(psql -X -A -t -v ON_ERROR_STOP=1 --dbname "$TARGET_URL" -c "
              SELECT COALESCE(max(version),'0000') FROM public.schema_migrations;
            ")"
          fi

          if [[ "$max_version" > "0002" ]]; then
            echo "BASELINE_0002_ALREADY_VERIFIED_BEFORE_LATER_MIGRATIONS"
          else
            MIGRATIONS_DIR="$PINNED_BASELINE_MIGRATIONS_DIR" bash scripts/db/migrate.sh
            psql -X -A -t -v ON_ERROR_STOP=1 --dbname "$TARGET_URL" \
              --file scripts/db/schema_fingerprint.sql > "$RUNNER_TEMP/live-0002.schema.txt"
            diff -u "$PINNED_MIGRATIONS_DIR/baselines/0002.schema.txt" "$RUNNER_TEMP/live-0002.schema.txt"
            echo "BASELINE_0002_FINGERPRINT_VERIFIED"
          fi

      - name: Apply pinned migrations 0001-0019 to the empty rehearsal database
        if: ${{ inputs.operation == 'bootstrap-and-migrate' }}
        shell: bash
        run: |
          set -euo pipefail
          MIGRATIONS_DIR="$PINNED_MIGRATIONS_DIR" bash scripts/db/migrate.sh

      - name: Run checkout, payment-allocation and inventory-ledger assertions
        if: ${{ inputs.operation == 'bootstrap-and-migrate' }}
        shell: bash
        run: |
          set -euo pipefail
          for version in 0017 0018 0019; do
            matches=("$PINNED_MIGRATIONS_DIR"/"${version}"_*.assertions.sql)
            test "${#matches[@]}" -eq 1
            psql -X -v ON_ERROR_STOP=1 --dbname "$MIGRATION_DATABASE_URL" --file "${matches[0]}"
            echo "MIGRATION_ASSERTIONS_PASSED=$version"
          done

      - name: Verify complete ledger, ownership and runtime boundaries
        if: ${{ inputs.operation == 'bootstrap-and-migrate' }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_URL="$NEON_REHEARSAL_TARGET_DATABASE_URL"
          ledger="$(psql -X -A -t -v ON_ERROR_STOP=1 --dbname "$TARGET_URL" -c "
            SELECT count(*)=19 AND max(version)='0019' AND bool_and(state='applied')
            FROM public.schema_migrations;
          ")"
          test "$ledger" = "t"

          ownership="$(psql -X -A -t -v ON_ERROR_STOP=1 --dbname "$TARGET_URL" -c "
            SELECT
              NOT EXISTS (
                SELECT 1 FROM pg_catalog.pg_class
                WHERE relnamespace='public'::regnamespace
                  AND relkind IN ('r','p','S','v','m')
                  AND relowner <> (SELECT oid FROM pg_catalog.pg_roles WHERE rolname='microapp_migrator')
              )
              AND NOT EXISTS (
                SELECT 1 FROM pg_catalog.pg_proc
                WHERE pronamespace='public'::regnamespace
                  AND proowner <> (SELECT oid FROM pg_catalog.pg_roles WHERE rolname='microapp_migrator')
              );
          ")"
          test "$ownership" = "t"
          echo "PINNED_REHEARSAL_MIGRATIONS_0001_0019_VERIFIED"
