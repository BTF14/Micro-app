name: ODD and agent documentation validation

on:
  pull_request:
    branches: [main, "fix/**"]
    paths:
      - 'AGENTS.md'
      - 'docs/CONSTITUTION.md'
      - 'docs/ODD_WORKFLOW.md'
      - 'docs/AI_COLLABORATION_AND_PR_POLICY.md'
      - 'docs/AGENT_OPERATING_MODEL.md'
      - 'docs/decisions/**'
      - 'docs/CURRENT_STATE.md'
      - 'docs/HANDOFF_NEXT_CHAT.md'
      - 'docs/WORK_CHECKPOINT.md'
      - 'odd/**'
      - '.github/agents/**'
      - 'tools/validate-agent-docs.py'
      - 'tools/tests/test_validate_agent_docs.py'
      - '.github/workflows/odd-docs-validation.yml'
  push:
    branches: [main]
    paths:
      - 'AGENTS.md'
      - 'docs/CONSTITUTION.md'
      - 'docs/ODD_WORKFLOW.md'
      - 'docs/AI_COLLABORATION_AND_PR_POLICY.md'
      - 'docs/AGENT_OPERATING_MODEL.md'
      - 'docs/decisions/**'
      - 'docs/CURRENT_STATE.md'
      - 'docs/HANDOFF_NEXT_CHAT.md'
      - 'docs/WORK_CHECKPOINT.md'
      - 'odd/**'
      - '.github/agents/**'
      - 'tools/validate-agent-docs.py'
      - 'tools/tests/test_validate_agent_docs.py'
      - '.github/workflows/odd-docs-validation.yml'

permissions:
  contents: read

jobs:
  validate-odd-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate ODD, continuity contract, ADR template and agent profiles
        run: python3 tools/validate-agent-docs.py
      - name: Test governance validator failure modes
        run: python3 -m unittest discover -s tools/tests -p 'test_validate_agent_docs.py' -v
