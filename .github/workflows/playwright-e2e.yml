name: Playwright E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: micro-app-playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: Chromium authentication smoke tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.9
      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install pinned Playwright runner in an isolated temporary directory
        run: npm install --prefix /tmp/micro-app-playwright --no-save --package-lock=false @playwright/test@1.55.0
      - name: Expose runner to the app without touching pnpm-managed packages
        run: |
          mkdir -p apps/web/node_modules/@playwright
          ln -s /tmp/micro-app-playwright/node_modules/@playwright/test apps/web/node_modules/@playwright/test
      # The pinned Playwright container includes Chromium and its OS libraries.
      # Avoid apt/browser bootstrap on each run; this step was repeatedly failing
      # before the browser tests could start, and GitHub's job log blob was unavailable.
      - name: Verify bundled browser runtime
        run: |
          test -d "${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}"
          test -n "$(find "${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}" -maxdepth 1 -type d -name 'chromium-*' -print -quit)"
      - name: Run browser tests
        run: /tmp/micro-app-playwright/node_modules/.bin/playwright test --config apps/web/playwright.config.ts
      - name: Upload Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-failure-${{ github.run_id }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
