name: Project progress dashboard
on:
  push:
    branches: [main, feat/project-progress-dashboard]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  generate-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Generate dashboard twice and verify deterministic output
        run: |
          python3 tools/project-progress.py
          sha256sum docs/progress/progress.json docs/progress/progress.svg docs/progress/index.html > /tmp/progress-first.sha256
          python3 tools/project-progress.py
          sha256sum -c /tmp/progress-first.sha256
      - name: Upload dashboard
        uses: actions/upload-artifact@v7
        with:
          name: micro-app-project-progress
          path: docs/progress/
          if-no-files-found: error
          retention-days: 14
