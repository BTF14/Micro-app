name: Project progress dashboard
on:
  push:
    branches: [main, feat/project-progress-dashboard]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  generate-progress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate dashboard
        run: python3 tools/project-progress.py
      - name: Upload dashboard
        uses: actions/upload-artifact@v4
        with:
          name: micro-app-project-progress
          path: docs/progress/
          if-no-files-found: error
          retention-days: 14
