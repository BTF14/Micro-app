name: Regenerate pnpm lockfile for a dependency-update branch

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Existing branch named chore/dependency-update-*"
        required: true
        type: string

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Validate target branch
        id: target
        shell: bash
        env:
          TARGET_BRANCH_INPUT: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          target="$TARGET_BRANCH_INPUT"
          if [[ ! "$target" =~ ^chore/dependency-update-[a-zA-Z0-9._-]+$ ]]; then
            echo "Refusing to regenerate a lockfile outside chore/dependency-update-* branches."
            exit 1
          fi
          echo "target_branch=$target" >> "$GITHUB_OUTPUT"

      - name: Checkout target branch without persistent credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.target_branch }}
          persist-credentials: false

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up pnpm 10
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Regenerate lockfile from manifests
        run: pnpm install --no-frozen-lockfile

      - name: Show lockfile diff
        run: git diff --stat -- pnpm-lock.yaml

      - name: Commit and push lockfile to the same dependency branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ steps.target.outputs.target_branch }}
        run: |
          set -euo pipefail
          git config user.email "deps-bot@micro-app.invalid"
          git config user.name "Micro app dependency bot"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml already matches package.json; no commit needed."
            exit 0
          fi
          git commit -m "chore(deps): regenerate pnpm lockfile"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push origin "HEAD:refs/heads/$TARGET_BRANCH"
