name: One-off — regenerate pnpm-lock.yaml after a package.json change

# Herramienta de un solo uso: este sandbox no puede alcanzar
# registry.npmjs.org (DNS bloqueado), así que cualquier cambio de
# dependencias/overrides en package.json necesita que un runner de GitHub
# Actions corra `pnpm install` y empuje el lockfile resultante. Se borra
# después de usarse — no es un workflow permanente.

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: Install (regenerates the lockfile to match package.json)
        run: pnpm install --no-frozen-lockfile
      - name: Show what changed
        run: git diff --stat
      - name: Commit and push to a dedicated branch
        run: |
          set -euo pipefail
          git config user.email "backups-bot@micro-app.invalid"
          git config user.name "Micro app deps bot"
          git checkout -b chore/lockfile-regen-result
          git add -A
          git commit -m "chore(deps): regenerate pnpm-lock.yaml"
          git push --force origin chore/lockfile-regen-result
