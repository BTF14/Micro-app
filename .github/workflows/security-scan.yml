name: Security scan

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: micro-app-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-filesystem:
    name: Trivy filesystem and configuration scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Initial baseline is non-blocking while findings and lockfile coverage
      # are reviewed. Includes secret detection. Do not scan container images:
      # this app targets Workers.
      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          format: table
          exit-code: '0'
