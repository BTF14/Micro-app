name: Agent skill integrity

on:
  pull_request:
    paths:
      - ".agents/skills/external-**/**"
      - "skill-install-log.json"
      - "scripts/validate-skill-install-log.mjs"
      - ".github/workflows/skill-integrity.yml"
  push:
    branches: [main]
    paths:
      - ".agents/skills/external-**/**"
      - "skill-install-log.json"
      - "scripts/validate-skill-install-log.mjs"
      - ".github/workflows/skill-integrity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate skill log and hashes
        run: node scripts/validate-skill-install-log.mjs
