name = "micro-app-bcv-sync"
main = "src/index.ts"
compatibility_date = "2026-10-17"
workers_dev = false

# Isolated Cron-only Worker. No workers.dev endpoint and no route bindings.
# Automatic synchronization is enabled for the isolated production Cron after
# DATABASE_URL_BCV_SYNC was provisioned with the microapp_bcv_sync PostgreSQL LOGIN.
# The handler never falls back to DATABASE_URL.
[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1

[vars]
APP_ENV = "production"
BCV_SYNC_ENABLED = "true"

[triggers]
crons = ["0 11 * * MON-FRI", "0 22 * * MON-FRI"]
