name = "micro-app-bcv-sync"
main = "src/index.ts"
compatibility_date = "2026-10-17"
workers_dev = false

# Isolated Cron-only Worker. No workers.dev endpoint and no route bindings.
# BCV ingestion is temporarily paused here: the dedicated Node.js GitHub Actions
# runner supplies the pinned intermediate CA with strict TLS verification.
# Keep the triggers declared for an easily reversible pause; the handler exits
# before database access while BCV_SYNC_ENABLED is false. The Node runner uses
# DATABASE_URL_BCV_SYNC and never falls back to the API runtime credential.
[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1

[vars]
APP_ENV = "production"
BCV_SYNC_ENABLED = "false"

[triggers]
crons = ["0 11 * * MON-FRI", "0 22 * * MON-FRI"]
