name = "micro-app-bcv-sync"
main = "src/index.ts"
compatibility_date = "2026-10-17"
workers_dev = false

# Isolated Cron-only Worker. No workers.dev endpoint and no route bindings.
# Keep synchronization disabled by default; enable only after explicit operational approval.
# Its DATABASE_URL must be provisioned as a separate encrypted secret using
# the microapp_bcv_sync PostgreSQL LOGIN; never copy the API Worker credential.
[observability]
enabled = true
redact_query_string = true

[observability.logs]
enabled = true
invocation_logs = false
head_sampling_rate = 1

[vars]
APP_ENV = "production"
BCV_SYNC_ENABLED = "false"

[triggers]
crons = ["0 22 * * 1-5"]
