name = "micro-app-api"
main = "src/index.ts"
compatibility_date = "2026-10-17"

[vars]
# These three are plain (non-secret) config, safe to commit: a Google OAuth
# client ID is designed to be public (it's exposed in the browser redirect
# URL anyway), and the other two are just this deployment's own URLs.
#
# This declaration matters beyond documentation: `wrangler deploy` treats
# [vars] as authoritative for plain (non-"Secreto") runtime variables. A var
# set only through the Cloudflare dashboard and never declared here gets
# silently wiped on the next deploy — that happened on 2026-10-25, breaking
# login right after it had been verified working end-to-end. GOOGLE_CLIENT_SECRET,
# DATABASE_URL, BOOTSTRAP_TOKEN and AUTH_RATE_LIMIT_HMAC_KEY are encrypted
# Worker secrets managed separately; never add their values here.
APP_ENV = "production"
FRONTEND_ORIGIN = "https://micro-app-63i.pages.dev"
GOOGLE_REDIRECT_URI = "https://micro-app-api.btfcasheb.workers.dev/auth/google/callback"
GOOGLE_CLIENT_ID = "1030757133503-huvhkok21n1br10rtfhs4827fo3v106q.apps.googleusercontent.com"

# Worker Previews are deliberately API-dark. Even if a Preview secret is
# accidentally configured, index.ts blocks every application route.
[previews.vars]
APP_ENV = "preview"

# Remove inactive, pseudonymous auth rate-limit buckets every hour.
[triggers]
crons = ["17 * * * *", "0 22 * * 1-5"]
